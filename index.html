<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b57d0"/>
<title>Tech X CMMS — IAC Cottondale</title>
<link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
<div class="appbar">
  <a class="brand" href="#/home">
    <div class="mark">TX</div>
    <div class="bname">Tech X <span>· Maintenance</span></div>
  </a>
  <div class="search">
    <span>&#128269;</span>
    <input id="globalSearch" placeholder="Search equipment, parts, work orders…" autocomplete="off"/>
  </div>
  <span id="connBadge" class="connchip" onclick="location.hash='#/settings'"></span>
</div>
<div class="shell">
  <!-- Every item carries data-s so updateChrome() can show or hide
       it using the same VIEWS list the router enforces. -->
  <nav class="rail" id="rail">
    <a class="nav" href="#/home" data-s="home"><span class="ico">&#127968;</span><span class="lbl">Home</span></a>
    <a class="nav" href="#/dashboard" data-s="dashboard"><span class="ico">&#128200;</span><span class="lbl">Dashboard</span></a>
    <a class="nav" href="#/assets" data-s="assets"><span class="ico">&#128451;</span><span class="lbl">Equipment</span></a>
    <hr/>
    <a class="nav accent-work" href="#/wo" data-s="work"><span class="ico">&#128736;</span><span class="lbl">Schedule Work</span></a>
    <a class="nav accent-stop" href="#/stops" data-s="stops"><span class="ico">&#9888;</span><span class="lbl">Production Loss</span><span class="navdot" id="navStopDot"></span></a>
    <hr/>
    <a class="nav" href="#/compliance" data-s="compliance"><span class="ico">&#9989;</span><span class="lbl">Compliance</span></a>
    <a class="nav" href="#/parts" data-s="parts"><span class="ico">&#128230;</span><span class="lbl">Spare Parts</span></a>
    <a class="nav" href="#/smart" data-s="smart"><span class="ico">&#128161;</span><span class="lbl">Smart Assist</span></a>
    <a class="nav" href="#/qr" data-s="qr"><span class="ico">&#128241;</span><span class="lbl">QR Tags</span></a>
    <hr/>
    <a class="nav" href="#/causes" data-s="causes"><span class="ico">&#128221;</span><span class="lbl">Cause Setup</span></a>
    <a class="nav" href="#/import" data-s="import"><span class="ico">&#11015;</span><span class="lbl">Import CSV</span></a>
    <a class="nav" href="#/users" data-s="users"><span class="ico">&#128101;</span><span class="lbl">Users</span></a>
    <a class="nav" href="#/settings" data-s="settings"><span class="ico">&#9881;</span><span class="lbl">Settings</span></a>
  </nav>
  <main class="content" id="view"></main>
</div>
<div class="drawer-scrim" id="scrim" onclick="Modal.close()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-hd"><b id="drawerTitle">Edit</b><button class="x" onclick="Modal.close()">&times;</button></div>
  <div class="drawer-bd" id="drawerBody"></div>
  <div class="drawer-ft" id="drawerFoot"></div>
</div>
<div class="toast" id="toast"></div>
<script src="assets/qr.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/db.js"></script>
<script src="assets/causes.js"></script>
<script src="assets/stops.js"></script>
<script src="assets/insights.js"></script>
<script src="assets/compliance.js"></script>
<script src="assets/csv.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/app.js"></script>

<button id="copilotDockBtn" class="copilot-dock-btn" onclick="toggleCopilotPanel()" title="Ask Tech X Copilot">&#128161;</button>
<aside id="copilotPanel" class="copilot-panel" aria-label="Tech X Copilot" aria-hidden="true">
  <div class="copilot-panel-head">
    <div><b>&#128161; Tech X Copilot</b><small>Screen-aware maintenance assistant</small></div>
    <div><button onclick="openM365Copilot()" title="Open Microsoft 365 Copilot">&#8599;</button><button onclick="toggleCopilotPanel(false)" title="Close">&#10005;</button></div>
  </div>
  <div id="copilotPanelScope" class="copilot-panel-scope"></div>
  <div id="copilotPanelMessages" class="copilot-panel-messages"></div>
  <div id="copilotPanelPrompts" class="copilot-panel-prompts"></div>
  <div class="copilot-panel-compose">
    <textarea id="copilotPanelInput" rows="2" placeholder="Ask about this screen..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();copilotPanelAsk()}"></textarea>
    <button onclick="copilotPanelAsk()" title="Ask">&#10148;</button>
  </div>
  <div class="copilot-panel-foot">Answers use Tech X data in this browser. Validate before acting.</div>
</aside>

</body>
</html>
